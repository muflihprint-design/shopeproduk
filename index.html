<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Walkie Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Custom Walkie Talkie Styles */
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Prevent zoom on double tap */
        }

        .walkie-body {
            background: linear-gradient(145deg, #2b3327, #1a2017);
            border-radius: 30px;
            box-shadow: 
                -10px 10px 20px #0a0d09,
                10px -10px 20px #34412f,
                inset 2px 2px 5px rgba(255,255,255,0.1),
                inset -5px -5px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .antenna {
            position: absolute;
            top: -80px;
            right: 40px;
            width: 24px;
            height: 100px;
            background: linear-gradient(to right, #111, #333, #111);
            border-radius: 12px 12px 0 0;
            z-index: 1;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
        }
        
        .antenna::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            width: 32px;
            height: 20px;
            background: #222;
            border-radius: 5px 5px 0 0;
        }

        .volume-knob {
            position: absolute;
            top: -25px;
            left: 50px;
            width: 40px;
            height: 30px;
            background: repeating-linear-gradient(90deg, #222, #222 2px, #444 2px, #444 4px);
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }

        .lcd-screen {
            background: #8b9d77;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px rgba(162, 185, 137, 0.5);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen.active {
            background: #a3c482;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.4), 0 0 15px rgba(163, 196, 130, 0.4);
        }

        /* Video Mode Styles */
        .video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .pip-video {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 70px;
            height: 90px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lcd-screen.video-mode {
            background: #111;
        }
        .lcd-screen.video-mode .video-feed,
        .lcd-screen.video-mode .pip-video {
            opacity: 1;
        }
        .lcd-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lcd-screen.video-mode .lcd-content {
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
        }
        .lcd-screen.video-mode #rx-indicator {
            color: #4ade80; /* Hijau terang agar terlihat di atas video */
        }

        .ptt-button {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            box-shadow: 
                -4px 4px 10px #11150f,
                4px -4px 10px #3f4d39,
                inset 2px 2px 5px rgba(255,100,100,0.4);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .ptt-button:active, .ptt-button.pressed {
            background: #9a0007;
            box-shadow: 
                inset 4px 4px 10px rgba(0,0,0,0.6),
                inset -2px -2px 5px rgba(255,255,255,0.1);
            transform: scale(0.96) translateY(2px);
        }

        .speaker-grille {
            background: radial-gradient(#111 20%, transparent 25%);
            background-size: 10px 10px;
            opacity: 0.8;
        }

        /* Pulse animation for transmitting status */
        @keyframes pulse-tx {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .tx-indicator {
            display: none;
        }
        .transmitting .tx-indicator {
            display: inline-block;
            animation: pulse-tx 0.8s infinite;
            color: #d32f2f;
            text-shadow: 0 0 5px red;
        }
    </style>
</head>
<body class="text-gray-200 antialiased">

    <!-- Main Walkie Talkie Device -->
    <div class="relative w-80 max-w-[95vw] mt-16 mb-8">
        <!-- Physical parts -->
        <div class="antenna"></div>
        <div class="volume-knob"></div>

        <!-- Body -->
        <div class="walkie-body p-6 border-4 border-[#1a2017]">
            
            <!-- Brand / Top Area -->
            <div class="flex justify-between items-center mb-4 text-xs font-bold tracking-widest text-gray-500 uppercase">
                <span>Comms-Pro</span>
                <span class="w-3 h-3 rounded-full bg-red-900 border border-gray-800 shadow-[inset_0_1px_3px_rgba(0,0,0,0.8)]" id="power-led"></span>
            </div>

            <!-- LCD / Video Screen -->
            <div id="lcd" class="lcd-screen rounded-lg h-44 mb-6 text-[#111] transition-all duration-300">
                <!-- Elemen Video -->
                <video id="remote-video" class="video-feed" autoplay playsinline></video>
                <video id="local-video" class="pip-video" autoplay playsinline muted></video>
                
                <!-- Teks OSD (On Screen Display) -->
                <div class="lcd-content p-3">
                    <div class="flex justify-between items-start">
                        <span class="text-sm font-bold tx-indicator">TX</span>
                        <span id="rx-indicator" class="text-sm font-bold opacity-0 transition-opacity text-green-900">RX</span>
                        <span id="status-icon" class="text-sm">✖</span>
                    </div>
                    <div class="text-center">
                        <div id="lcd-status" class="text-lg font-bold uppercase tracking-wider mb-1">Offline</div>
                        <div id="lcd-room" class="text-2xl font-bold tracking-widest">---</div>
                    </div>
                </div>
            </div>

            <!-- Connection Controls (Hidden during call) -->
            <div id="setup-panel" class="space-y-4 mb-6">
                <div>
                    <button id="btn-create" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg shadow-[inset_0_1px_0_rgba(255,255,255,0.1),_0_2px_4px_rgba(0,0,0,0.5)] border border-gray-900 transition-colors">
                        Create New Room
                    </button>
                </div>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-700"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-500 text-xs uppercase font-bold">OR</span>
                    <div class="flex-grow border-t border-gray-700"></div>
                </div>

                <div class="flex space-x-2">
                    <input type="text" id="join-room-id" placeholder="Room ID" class="w-2/3 bg-gray-900 border border-gray-700 text-white text-center rounded-lg focus:outline-none focus:border-green-500 uppercase tracking-widest font-mono" autocomplete="off">
                    <button id="btn-join" class="w-1/3 bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-2 rounded-lg shadow-[inset_0_1px_0_rgba(255,255,255,0.1),_0_2px_4px_rgba(0,0,0,0.5)] border border-gray-900 transition-colors text-sm">
                        Join
                    </button>
                </div>
            </div>

            <!-- Active Call Controls (Hidden initially) -->
            <div id="call-panel" class="hidden mb-6 flex flex-col items-center">
                <button id="btn-copy" class="mb-4 text-xs bg-gray-800 text-gray-300 py-1 px-3 rounded shadow border border-gray-700 hover:text-white">
                    Copy Room ID
                </button>
                
                <!-- Tombol Kontrol Video (benar-benar mematikan perangkat keras kamera) -->
                <div class="flex space-x-2 mb-3">
                    <button id="btn-toggle-video" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-3 rounded shadow border border-gray-700 flex items-center space-x-1 transition-colors">
                        <span id="video-icon">📷</span>
                        <span id="video-btn-text">Kamera: ON</span>
                    </button>
                </div>
                
                <p class="text-xs text-center text-gray-400 mb-2 font-mono">HOLD TO SPEAK</p>
                
                <!-- Large Push to Talk Button -->
                <button id="btn-ptt" class="ptt-button w-32 h-32 rounded-full flex items-center justify-center border-4 border-[#111]">
                    <span class="text-white font-bold text-xl tracking-wider text-shadow-sm">PTT</span>
                </button>
                
                <button id="btn-hangup" class="mt-8 text-xs text-red-500 hover:text-red-400 uppercase tracking-widest font-bold">
                    Disconnect
                </button>
            </div>

            <!-- Speaker Grille -->
            <div class="h-24 w-full speaker-grille rounded-lg border border-gray-900 shadow-[inset_0_2px_10px_rgba(0,0,0,0.8)]"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global state variables
        let app, db, auth;
        let appId, userId;
        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;
        let roomId = null;
        let isCaller = false;
        let unsubscribers = [];
        
        let audioContext = null;
        
        // STUN servers for WebRTC
        const configuration = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // UI Elements
        const ui = {
            lcd: document.getElementById('lcd'),
            lcdStatus: document.getElementById('lcd-status'),
            lcdRoom: document.getElementById('lcdRoom'),
            lcdRoomText: document.getElementById('lcd-room'),
            statusIcon: document.getElementById('status-icon'),
            rxIndicator: document.getElementById('rx-indicator'),
            setupPanel: document.getElementById('setup-panel'),
            callPanel: document.getElementById('call-panel'),
            btnCreate: document.getElementById('btn-create'),
            btnJoin: document.getElementById('btn-join'),
            joinInput: document.getElementById('join-room-id'),
            btnPtt: document.getElementById('btn-ptt'),
            btnHangup: document.getElementById('btn-hangup'),
            btnCopy: document.getElementById('btn-copy'),
            btnToggleVideo: document.getElementById('btn-toggle-video'),
            videoIcon: document.getElementById('video-icon'),
            videoBtnText: document.getElementById('video-btn-text'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            powerLed: document.getElementById('power-led')
        };

        async function initApp() {
            try {
                // --- KONFIGURASI FIREBASE MILIK ANDA ---
                // Ganti nilai-nilai di bawah ini dengan config dari Firebase Console Anda!
                const myFirebaseConfig = {
                   apiKey: "AIzaSyB8Z9x6ovw6AW-bvCJr02Gdzb1-WKMPefw",
  authDomain: "walkitalki-6985b.firebaseapp.com",
  projectId: "walkitalki-6985b",
  storageBucket: "walkitalki-6985b.firebasestorage.app",
  messagingSenderId: "503583235135",
  appId: "1:503583235135:web:7fa355d440ce17cf402c8a"
                };

                // Logika Cerdas: Gunakan config internal jika di Gemini, gunakan config Anda jika di luar (GitHub Pages/Lokal)
                const isGeminiEnv = typeof __firebase_config !== 'undefined';
                const firebaseConfig = isGeminiEnv ? JSON.parse(__firebase_config) : myFirebaseConfig;
                
                // Gunakan ID statis untuk database eksternal agar lintas-perangkat bisa mencari di folder yang sama
                appId = isGeminiEnv ? __app_id : 'walkie-talkie-public-rooms';
                
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authenticate
                if (isGeminiEnv && typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth); // Akan menggunakan Authentication dari Firebase Anda
                }
                
                userId = auth.currentUser.uid;
                
                updateLCD("READY", "---", "●");
                ui.powerLed.classList.remove('bg-red-900');
                ui.powerLed.classList.add('bg-green-500', 'shadow-[0_0_8px_#4ade80]');
                ui.lcd.classList.add('active');

            } catch (error) {
                console.error("Firebase init error:", error);
                updateLCD("ERR: AUTH", "---", "✖");
            }
        }

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Generates walkie-talkie squelch/beep sounds using oscillators
        function playSfx(type) {
            if (!audioContext) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            const now = audioContext.currentTime;

            if (type === 'tx-start') {
                // Chirp up
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'tx-end') {
                // Roger beep
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.setValueAtTime(0.1, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        async function openUserMedia() {
            initAudioContext(); // Ensure audio context is ready on user gesture
            try {
                // Request video dan audio
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // Tampilkan kamera lokal di mode Picture-in-Picture & ubah layar ke mode Video
                ui.localVideo.srcObject = localStream;
                ui.lcd.classList.add('video-mode');
                
                // Mute stream audio (mikrofon) lokal secara default. Hanya aktif saat PTT ditekan.
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = false;
                });
                return true;
            } catch (error) {
                console.error("Error accessing media devices.", error);
                updateLCD("NO CAM/MIC", "---", "✖");
                alert("Akses Kamera dan Mikrofon diperlukan untuk Video Walkie Talkie.");
                return false;
            }
        }

        async function createRoom() {
            if (!auth.currentUser) return;
            const hasMedia = await openUserMedia();
            if (!hasMedia) return;

            updateLCD("CREATING", "...", "⧖");
            isCaller = true;

            // Initialize Peer Connection
            peerConnection = new RTCPeerConnection(configuration);
            setupWebRTCListeners();
            
            // Add local tracks to peer connection
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Firestore references
            const roomRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'));
            roomId = roomRef.id;
            
            // Just take first 5 chars for a simple room code (Walkie talkie style)
            const shortRoomId = roomId.substring(0, 5).toUpperCase();

            const callerCandidatesCollection = collection(roomRef, 'callerCandidates');

            // Collect ICE candidates and save them to Firestore
            peerConnection.addEventListener('icecandidate', event => {
                if (event.candidate) {
                    addDoc(callerCandidatesCollection, event.candidate.toJSON());
                }
            });

            // Create Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            const roomWithOffer = {
                offer: {
                    type: offer.type,
                    sdp: offer.sdp
                },
                createdAt: new Date().toISOString() // for cleanup if necessary later
            };
            
            await setDoc(roomRef, roomWithOffer);
            
            showCallPanel(shortRoomId);
            updateLCD("WAITING", shortRoomId, "⧖");

            // Listen for remote answer
            const unsubRoom = onSnapshot(roomRef, async snapshot => {
                if (!peerConnection) return; // Pencegahan jika koneksi sudah ditutup
                const data = snapshot.data();
                if (!peerConnection.currentRemoteDescription && data && data.answer) {
                    const rtcSessionDescription = new RTCSessionDescription(data.answer);
                    await peerConnection.setRemoteDescription(rtcSessionDescription);
                    updateLCD("CONNECTED", shortRoomId, "✔");
                }
            }, (error) => console.error("Room snapshot error:", error));
            unsubscribers.push(unsubRoom);

            // Listen for remote ICE candidates
            const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
            const unsubCallee = onSnapshot(calleeCandidatesCollection, snapshot => {
                if (!peerConnection) return; // Pencegahan jika koneksi sudah ditutup
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added') {
                        let data = change.doc.data();
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data));
                    }
                });
            }, (error) => console.error("Callee ICE error:", error));
            unsubscribers.push(unsubCallee);
        }

        async function joinRoom(shortId) {
            if (!auth.currentUser) return;
            if (!shortId) return;

            const hasMedia = await openUserMedia();
            if (!hasMedia) return;

            updateLCD("JOINING", shortId, "⧖");
            isCaller = false;

            // Search for the room starting with the short ID
            const roomsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
            const roomsSnapshot = await getDocs(roomsCol);
            
            let fullRoomId = null;
            let roomData = null;

            roomsSnapshot.forEach(doc => {
                if (doc.id.toUpperCase().startsWith(shortId.toUpperCase())) {
                    fullRoomId = doc.id;
                    roomData = doc.data();
                }
            });

            if (!fullRoomId || !roomData || !roomData.offer) {
                updateLCD("NOT FOUND", shortId, "✖");
                setTimeout(() => {
                    updateLCD("READY", "---", "●");
                }, 2000);
                return;
            }

            roomId = fullRoomId;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);

            peerConnection = new RTCPeerConnection(configuration);
            setupWebRTCListeners();

            // Add local tracks
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
            peerConnection.addEventListener('icecandidate', event => {
                if (event.candidate) {
                    addDoc(calleeCandidatesCollection, event.candidate.toJSON());
                }
            });

            // Set remote description from offer
            const offer = roomData.offer;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            // Create and set answer
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            const roomWithAnswer = {
                answer: {
                    type: answer.type,
                    sdp: answer.sdp
                }
            };
            await updateDoc(roomRef, roomWithAnswer);

            showCallPanel(shortId);
            updateLCD("CONNECTED", shortId, "✔");

            // Listen for caller ICE candidates
            const callerCandidatesCollection = collection(roomRef, 'callerCandidates');
            const unsubCaller = onSnapshot(callerCandidatesCollection, snapshot => {
                if (!peerConnection) return; // Pencegahan jika koneksi sudah ditutup
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added') {
                        let data = change.doc.data();
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data));
                    }
                });
            }, (error) => console.error("Caller ICE error:", error));
            unsubscribers.push(unsubCaller);
        }

        function setupWebRTCListeners() {
            peerConnection.addEventListener('track', event => {
                // When we receive a remote stream (audio atau video)
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    ui.remoteVideo.srcObject = remoteStream;
                }
                remoteStream.addTrack(event.track);

                // Setup listener to show RX indicator when audio is playing
                // WebRTC audio doesn't have a simple "is talking" event out of the box without Web Audio API,
                // but we can monitor connection state.
            });

            peerConnection.addEventListener('connectionstatechange', () => {
                console.log("Connection state:", peerConnection.connectionState);
                if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    hangUp();
                } else if (peerConnection.connectionState === 'connected') {
                    // Start an audio context analyzer to detect remote audio level for RX indicator
                    setupAudioLevelMonitor();
                }
            });
        }

        let isTransmitting = false;

        function startPTT(e) {
            if (e) {
                e.preventDefault(); // Prevent duplicate touch/mouse events
                e.stopPropagation();
            }
            if (!peerConnection || peerConnection.connectionState !== 'connected' || isTransmitting) return;
            
            isTransmitting = true;
            ui.btnPtt.classList.add('pressed');
            ui.lcd.classList.add('transmitting');
            
            playSfx('tx-start');

            // Unmute mic
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = true;
                });
            }
        }

        function stopPTT(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!isTransmitting) return;

            isTransmitting = false;
            ui.btnPtt.classList.remove('pressed');
            ui.lcd.classList.remove('transmitting');

            // Mute mic
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = false;
                });
            }
            
            playSfx('tx-end');
        }

        // PTT Event Listeners (Mouse & Touch)
        ui.btnPtt.addEventListener('mousedown', startPTT);
        ui.btnPtt.addEventListener('touchstart', startPTT, {passive: false});
        
        window.addEventListener('mouseup', stopPTT);
        window.addEventListener('touchend', stopPTT);
        // If mouse leaves button while pressed, we can decide to keep it on or stop. Usually stop.
        ui.btnPtt.addEventListener('mouseleave', stopPTT);
        ui.btnPtt.addEventListener('touchcancel', stopPTT);


        function setupAudioLevelMonitor() {
            if (!audioContext || !remoteStream) return;
            
            const source = audioContext.createMediaStreamSource(remoteStream);
            const analyzer = audioContext.createAnalyser();
            analyzer.fftSize = 256;
            source.connect(analyzer);

            const bufferLength = analyzer.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function checkLevel() {
                if (peerConnection && peerConnection.connectionState === 'connected') {
                    analyzer.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    const average = sum / bufferLength;

                    // If volume > threshold, show RX
                    if (average > 5 && !isTransmitting) {
                        ui.rxIndicator.style.opacity = '1';
                    } else {
                        ui.rxIndicator.style.opacity = '0';
                    }
                    requestAnimationFrame(checkLevel);
                } else {
                    ui.rxIndicator.style.opacity = '0';
                }
            }
            checkLevel();
        }


        function updateLCD(status, roomStr, icon) {
            ui.lcdStatus.innerText = status;
            ui.lcdRoomText.innerText = roomStr || "---";
            ui.statusIcon.innerText = icon || "";
        }

        function showCallPanel(shortId) {
            ui.setupPanel.classList.add('hidden');
            ui.callPanel.classList.remove('hidden');
            ui.lcdRoomText.innerText = shortId;
        }

        async function hangUp() {
            // Hentikan semua listener database agar tidak terjadi error (memory leak)
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteStream = null;
            
            // Bersihkan video element dan kembalikan layar ke LCD hijau
            ui.remoteVideo.srcObject = null;
            ui.localVideo.srcObject = null;
            ui.lcd.classList.remove('video-mode');

            // Optional: delete room from firestore if caller
            if (isCaller && roomId && auth.currentUser) {
                try {
                   const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                   await deleteDoc(roomRef);
                } catch(e) { console.log("Error cleaning up room", e); }
            }

            roomId = null;
            isCaller = false;
            
            ui.callPanel.classList.add('hidden');
            ui.setupPanel.classList.remove('hidden');
            updateLCD("READY", "---", "●");
            ui.rxIndicator.style.opacity = '0';
        }

        // Button Listeners
        ui.btnCreate.addEventListener('click', createRoom);
        
        ui.btnJoin.addEventListener('click', () => {
            const val = ui.joinInput.value.trim();
            if (val) {
                joinRoom(val);
            }
        });

        ui.btnHangup.addEventListener('click', hangUp);

        ui.btnCopy.addEventListener('click', () => {
            const shortId = ui.lcdRoomText.innerText;
            if (shortId && shortId !== '---') {
                try {
                    const el = document.createElement('textarea');
                    el.value = shortId;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    
                    const originalText = ui.btnCopy.innerText;
                    ui.btnCopy.innerText = "Copied!";
                    setTimeout(() => ui.btnCopy.innerText = originalText, 2000);
                } catch(e) { console.error("Copy failed", e); }
            }
        });

        let isVideoEnabled = true;
        
        ui.btnToggleVideo.addEventListener('click', async () => {
            if (!localStream) return;

            if (isVideoEnabled) {
                // PROSES MEMATIKAN KAMERA (Lampu indikator akan mati)
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.stop(); // Matikan hardware kamera sepenuhnya
                    localStream.removeTrack(videoTrack); // Hapus track dari stream lokal
                }
                
                isVideoEnabled = false;
                ui.videoIcon.innerText = "🚫";
                ui.videoBtnText.innerText = "Kamera: OFF";
                ui.localVideo.classList.add('opacity-20', 'grayscale');
                
            } else {
                // PROSES MENYALAKAN KEMBALI KAMERA
                try {
                    // Minta akses kamera lagi. 
                    // Browser TIDAK akan memunculkan popup karena izin sudah diingat di awal sesi.
                    const newStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    
                    // Tambahkan track video baru ke stream lokal
                    localStream.addTrack(newVideoTrack);
                    
                    // Refresh tampilan video lokal di layar LCD
                    ui.localVideo.srcObject = localStream;
                    
                    // Jika sedang dalam panggilan (terhubung ke PeerConnection), update jalurnya
                    if (peerConnection) {
                        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            // Ganti track video lama (yang sudah mati) dengan track video yang baru nyala
                            sender.replaceTrack(newVideoTrack);
                        } else {
                            // Jika sebelumnya tidak ada sender, tambahkan track baru
                            peerConnection.addTrack(newVideoTrack, localStream);
                        }
                    }

                    isVideoEnabled = true;
                    ui.videoIcon.innerText = "📷";
                    ui.videoBtnText.innerText = "Kamera: ON";
                    ui.localVideo.classList.remove('opacity-20', 'grayscale');
                    
                } catch (error) {
                    console.error("Gagal menyalakan kembali kamera:", error);
                    alert("Gagal mengakses perangkat kamera.");
                }
            }
        });
        // Initialize Application
        initApp();

    </script>
</body>
</html>
